<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2" />

  <!-- Directed DAG Edges (with arrow-like flow) -->
  <!-- Edge 1 to 2 -->
  <line x1="18" y1="36" x2="32" y2="18" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,1" />
  <!-- Edge 1 to 3 -->
  <line x1="18" y1="36" x2="32" y2="48" stroke="#6366f1" stroke-width="2.5" />
  <!-- Edge 2 to 4 -->
  <line x1="32" y1="18" x2="48" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3,1" />
  <!-- Edge 3 to 4 -->
  <line x1="32" y1="48" x2="48" y2="32" stroke="#6366f1" stroke-width="2.5" />

  <!-- Graph Nodes -->
  <!-- Origin Node (Blue) -->
  <circle cx="18" cy="36" r="6" fill="#3b82f6" stroke="#ffffff" stroke-width="1.8" filter="url(#nodeGlow)" />

  <!-- Branch Node 1 (Critical Path - Gold) -->
  <circle cx="32" cy="18" r="6.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
  <text x="32" y="20.5" font-size="7" fill="#ffffff" font-weight="bold" text-anchor="middle">★</text>

  <!-- Branch Node 2 (Purple) -->
  <circle cx="32" cy="48" r="5.5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.8" />

  <!-- Target Hub Node (Emerald / Completed) -->
  <circle cx="48" cy="32" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <text x="48" y="34.5" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">✓</text>
</svg>
